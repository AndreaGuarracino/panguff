[package]
name = "panguff"
version = "0.1.0"
authors = ["Andrea Guarracino <aguarra1@uthsc.edu>"]
edition = "2024"

[lib]
name = "panguff"
path = "src/lib.rs"

[[bin]]
name = "panguff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
zstd = "0.13"
log = "0.4"
env_logger = "0.11"
rayon = "1.11"
rustc-hash = "2.1"
indicatif = "0.17"
